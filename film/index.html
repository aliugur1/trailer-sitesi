<!doctype html>
<html
  lang="tr"
  data-composition-variables='[
    {"id":"mark","type":"string","label":"Rozet","default":"nt."},
    {"id":"name1","type":"string","label":"Marka, 1. satır","default":"NOVA"},
    {"id":"name2","type":"string","label":"Marka, 2. satır","default":"TREYLER"},
    {"id":"phone","type":"string","label":"Telefon","default":"0 000 000 00 00"},
    {"id":"cta","type":"string","label":"Düğme","default":"Teklif Al"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #13161b; }
      #root { position: relative; width: 1920px; height: 1080px; }
      .zoom { position: absolute; inset: 0; }
      .zoom > video, .zoom > img { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; object-fit: contain; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="30" data-width="1920" data-height="1080">
      <!-- 0-21 s: gerçek sitenin kare kare çekimi (ilk ekran, çizim perdesi, yapılandırıcı) -->
      <div id="acts-zoom" class="zoom">
        <video id="acts-vid" class="clip" src="assets/acts.mp4" data-start="0" data-duration="21" data-track-index="0" muted playsinline></video>
      </div>
      <!-- 21-25.2 s: gerçek teklif formu, seçim mesaj alanında hazır -->
      <div id="contact-zoom" class="zoom">
        <img id="contact-img" class="clip" src="assets/contact.png" data-start="21" data-duration="4.2" data-track-index="0" alt="" />
      </div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="25.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="wipe" data-composition-id="wipe" data-composition-src="compositions/wipe.html" data-start="20.6" data-duration="0.9" data-track-index="3" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="25.2" data-duration="4.8" data-track-index="4" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // yapılandırma boyunca ham görüntüye yavaş itme (panel ve treyler kadrajda kalır)
      tl.fromTo("#acts-zoom", { scale: 1, transformOrigin: "1280px 260px" }, { scale: 1.08, duration: 11, ease: "none" }, 9.5);
      // teklif formunda mesaj alanına itme
      tl.fromTo("#contact-zoom", { scale: 1, transformOrigin: "1250px 640px" }, { scale: 2.1, duration: 1.6, ease: "power3.inOut" }, 22.0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
