<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; }
    #wipe-bar { position: absolute; inset: 0; background: #ffc400; }
  </style>
  <div id="root" data-composition-id="wipe" data-width="1920" data-height="1080">
    <div id="wipe-bar" class="clip" data-start="0" data-duration="0.9" data-track-index="1"></div>
  </div>
  <script>
    const tl = gsap.timeline({ paused: true });
    // sarı blok soldan girer (0.4 s), ortasında kesme olur, sağdan çıkar (0.5 s)
    tl.fromTo("#wipe-bar", { xPercent: -100 }, { xPercent: 0, duration: 0.4, ease: "power3.in" }, 0);
    tl.to("#wipe-bar", { xPercent: 100, duration: 0.5, ease: "power3.out" }, 0.4);
    window.__timelines["wipe"] = tl;
  </script>
</template>
